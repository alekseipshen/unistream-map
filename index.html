<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>ЮНИСТРИМ — обменные пункты у метро</title>
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23ffd400'/><text x='50' y='72' font-size='60' text-anchor='middle' font-family='Arial' font-weight='bold' fill='%231a3e8c'>Ю</text></svg>">
<style>
  :root {
    --blue: #1a3e8c; --blue-dark: #12295e; --yellow: #ffd400;
    --bg: #f2f4f8; --card: #ffffff; --line: #dfe4ec;
    --ok: #178a3c; --closed: #c62828; --muted: #67707f;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font: 16px/1.45 -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg); color: #1c2330;
  }
  header {
    background: var(--blue); color: #fff;
    padding: 10px 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  }
  header .logo {
    background: var(--yellow); color: var(--blue); font-weight: 800;
    border-radius: 8px; padding: 3px 10px; font-size: 18px; letter-spacing: .5px;
  }
  header h1 { font-size: 17px; margin: 0; font-weight: 600; }
  .tabs { display: flex; gap: 4px; margin-left: 8px; }
  .tabs a {
    color: #fff; text-decoration: none; padding: 5px 14px; border-radius: 8px 8px 0 0;
    font-size: 14px; font-weight: 600; background: rgba(255,255,255,.12);
  }
  .tabs a.active { background: var(--bg); color: var(--blue); }
  header .rates-status { margin-left: auto; font-size: 13px; opacity: .85; }
  header .rates-status button {
    margin-left: 8px; border: 1px solid rgba(255,255,255,.5); background: transparent;
    color: #fff; border-radius: 6px; padding: 3px 10px; font-size: 13px; cursor: pointer;
  }
  header .rates-status button:hover { background: rgba(255,255,255,.15); }

  .searchwrap { position: relative; padding: 12px 16px; background: var(--blue-dark); }
  #q {
    width: 100%; font-size: 20px; padding: 12px 44px 12px 14px;
    border: 2px solid transparent; border-radius: 10px; outline: none;
  }
  #q:focus { border-color: var(--yellow); }
  #clearq {
    position: absolute; right: 26px; top: 50%; transform: translateY(-50%);
    border: 0; background: transparent; font-size: 22px; color: #888; cursor: pointer;
    display: none; line-height: 1; padding: 4px;
  }
  .suggest {
    position: absolute; left: 16px; right: 16px; top: calc(100% - 6px); z-index: 1200;
    background: #fff; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.25);
    max-height: 46vh; overflow-y: auto; display: none;
  }
  .suggest div {
    padding: 11px 14px; cursor: pointer; display: flex; align-items: center; gap: 9px;
    border-bottom: 1px solid var(--line); font-size: 17px;
  }
  .suggest div:last-child { border-bottom: 0; }
  .suggest div.active, .suggest div:hover { background: #eef3ff; }
  .dot { width: 12px; height: 12px; border-radius: 50%; flex: 0 0 12px; }

  .layout { display: flex; height: calc(100vh - 118px); }
  .panel { width: 460px; min-width: 340px; overflow-y: auto; padding: 12px; }
  #map { flex: 1; min-height: 200px; }

  .hint { color: var(--muted); font-size: 14px; margin: 4px 2px 10px; }
  .station-head {
    background: var(--card); border-radius: 12px; padding: 10px 14px; margin-bottom: 10px;
    display: flex; align-items: center; gap: 10px; border: 1px solid var(--line);
  }
  .station-head b { font-size: 18px; }
  .station-head .lines { display: flex; gap: 5px; }

  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 14px 16px; margin-bottom: 12px; cursor: pointer;
    transition: box-shadow .15s;
  }
  .card:hover { box-shadow: 0 4px 14px rgba(20,40,90,.12); }
  .card.selected { border: 2px solid var(--blue); }
  .card .toprow { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .card .num {
    background: var(--yellow); color: var(--blue); font-weight: 800; font-size: 19px;
    border-radius: 8px; padding: 2px 10px;
  }
  .walk { margin-left: auto; font-weight: 700; color: var(--blue); font-size: 15px; white-space: nowrap; }
  .card .addr { margin: 8px 0 2px; font-size: 16px; }
  .card .metro-tags { margin: 4px 0; display: flex; gap: 6px; flex-wrap: wrap; }
  .mtag {
    font-size: 13px; background: #eef1f7; border-radius: 6px; padding: 2px 8px; color: #333;
  }
  .mtag::before { content: "Ⓜ "; color: #d21f26; font-weight: 700; }
  .kv { font-size: 14px; color: var(--muted); margin-top: 2px; }
  .kv b { color: #1c2330; font-weight: 600; }
  details.howto { margin-top: 6px; font-size: 14px; }
  details.howto summary { cursor: pointer; color: var(--blue); font-weight: 600; }
  details.howto p { margin: 6px 0 0; color: #333; white-space: pre-line; }

  table.rates { border-collapse: collapse; margin-top: 8px; width: 100%; max-width: 340px; }
  table.rates th, table.rates td {
    text-align: right; padding: 4px 10px; font-size: 15px; border-bottom: 1px solid var(--line);
  }
  table.rates th { color: var(--muted); font-weight: 600; font-size: 13px; }
  table.rates td:first-child, table.rates th:first-child { text-align: left; font-weight: 700; }
  .rates-note { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .stale { color: #b26a00; }
  .cur-chips { margin-top: 6px; font-size: 13px; color: var(--muted); }
  .actions { margin-top: 10px; display: flex; gap: 14px; flex-wrap: wrap; }
  .actions a { color: var(--blue); font-weight: 600; text-decoration: none; font-size: 14px; }
  .actions a:hover { text-decoration: underline; }

  .arb {
    background: #fdecec; border: 1px solid #f3c2c2; border-left: 4px solid var(--closed);
    border-radius: 8px; padding: 8px 11px; margin: 8px 0; font-size: 14px;
  }
  .arb b { color: var(--closed); }
  .arb > div { margin-top: 3px; }
  .arb-note { color: var(--muted); font-size: 13px; margin-top: 5px; }
  .comp-block { margin-top: 10px; border-top: 1px dashed var(--line); padding-top: 8px; }
  .comp-head { font-size: 14px; font-weight: 600; color: #1c2330; }
  .comp-warn { color: var(--closed); font-weight: 700; }
  .comp-ok { color: var(--ok); font-weight: 600; }
  .comp-lines { margin-top: 4px; font-size: 14px; }
  .comp-lines div { margin: 2px 0; }
  details.comp summary { cursor: pointer; color: var(--blue); font-weight: 600; font-size: 14px; margin-top: 6px; }
  table.comp-tbl { border-collapse: collapse; width: 100%; margin-top: 8px; font-size: 14px; }
  table.comp-tbl th, table.comp-tbl td { padding: 3px 6px; border-bottom: 1px solid var(--line); text-align: right; }
  table.comp-tbl th { color: var(--muted); font-size: 12px; font-weight: 600; }
  table.comp-tbl td:first-child, table.comp-tbl th:first-child { text-align: left; }
  table.comp-tbl td.worse { color: var(--closed); font-weight: 700; }
  .comp-name { font-weight: 600; }
  .comp-addr { color: var(--muted); font-size: 12.5px; }
  .comp-item { margin-top: 10px; padding: 6px 8px; border-radius: 8px; cursor: pointer; }
  .comp-item:hover { background: #eef3ff; }
  .comp-show { color: var(--blue); font-weight: 600; opacity: 0; }
  .comp-item:hover .comp-show { opacity: 1; }
  @media (hover: none) { .comp-show { opacity: 1; } }
  .compmarker {
    border-radius: 50%; border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.45);
    background: #6b7a90;
  }
  .compmarker.beats { background: var(--closed); }
  /* курс банка по городу, не по офису — рисуем меньше и полупрозрачно */
  .compmarker.city { opacity: .75; border-width: 1px; }
  .brmarker {
    background: var(--yellow); border: 2px solid var(--blue); border-radius: 8px;
    color: var(--blue); font-weight: 800; font-size: 13px; text-align: center;
    line-height: 22px; box-shadow: 0 1px 4px rgba(0,0,0,.4); white-space: nowrap;
  }
  .brmarker.near { background: var(--blue); color: #fff; border-color: var(--yellow); }
  /* дежурные отделения — светлые, чтобы не путать с постоянными */
  .brmarker.duty { background: #fff; color: var(--blue); border-color: var(--blue); border-style: dashed; }
  .num.duty { background: #fff; border: 2px solid var(--blue); }
  .duty-tag {
    font-size: 12px; font-weight: 700; color: var(--blue); background: #e8edf7;
    border-radius: 20px; padding: 2px 9px;
  }
  .stmarker {
    background: #d21f26; color: #fff; border-radius: 50%; text-align: center;
    font-weight: 800; line-height: 26px; font-size: 15px; border: 2px solid #fff;
    box-shadow: 0 1px 5px rgba(0,0,0,.5);
  }
  .leaflet-popup-content { font-size: 14px; }

  @media (max-width: 800px) {
    .layout { flex-direction: column; height: auto; }
    #map { height: 44vh; order: 1; }
    .panel { width: 100%; min-width: 0; order: 2; }
    header h1 { font-size: 14px; }
  }
</style>
</head>
<body>
<header>
  <span class="logo">ЮНИСТРИМ</span>
  <h1>Обменные пункты — Москва</h1>
  <nav class="tabs">
    <a href="index.html" class="active">Карта</a>
    <a href="table.html">Таблица</a>
  </nav>
  <span class="rates-status"><span id="ratesStamp">Курсы: загрузка…</span><button id="refreshBtn">Обновить</button></span>
</header>

<div class="searchwrap">
  <input id="q" type="text" placeholder="Введите станцию метро — например, Фили" autocomplete="off">
  <button id="clearq" title="Сбросить">✕</button>
  <div class="suggest" id="suggest"></div>
</div>

<div class="layout">
  <div class="panel" id="panel"></div>
  <div id="map"></div>
</div>

<script src="vendor/leaflet.js"></script>
<script src="data/branches.js"></script>
<script src="data/branches_duty.js"></script>
<script src="data/competitors_oblast.js"></script>
<script src="data/metro.js"></script>
<script src="data/competitors.js"></script>
<script src="data/poi.js"></script>
<script src="data/bankrates.js"></script>
<script src="data/volatility.js"></script>
<script src="data/offices_mainfin.js"></script>
<script>
/* ---------- утилиты ---------- */
const norm = s => s.toLowerCase().replace(/ё/g, "е").replace(/[-–—]/g, " ").replace(/\s+/g, " ").trim();
const distM = (a, b, c, d) => {
  const R = 6371000, p1 = a * Math.PI / 180, p2 = c * Math.PI / 180,
        dp = (c - a) * Math.PI / 180, dl = (d - b) * Math.PI / 180,
        h = Math.sin(dp/2)**2 + Math.cos(p1) * Math.cos(p2) * Math.sin(dl/2)**2;
  return 2 * R * Math.asin(Math.sqrt(h));
};
const walkInfo = m => {
  const wm = Math.ceil(m * 1.35 / 80); // обход домов + 4.8 км/ч
  const dist = m < 950 ? `${Math.round(m / 50) * 50} м` : `${(m / 1000).toFixed(1)} км`;
  return { min: wm, txt: wm <= 45 ? `≈ ${wm} мин пешком · ${dist}` : `далеко · ${dist}` };
};
const DAYS_RU = { Mon: "Пн", Tue: "Вт", Wed: "Ср", Thu: "Чт", Fri: "Пт", Sat: "Сб", Sun: "Вс" };
const CUR_SIGN = { USD: "$", EUR: "€", GBP: "£", CNY: "¥", CHF: "₣", AED: "AED", TRY: "₺", KZT: "₸", RUB: "₽" };

function hoursText(b) {
  const groups = [];
  for (const h of b.hours) {
    const key = h.o + "–" + h.c;
    const g = groups[groups.length - 1];
    if (g && g.key === key) g.days.push(h.d);
    else groups.push({ key, days: [h.d], o: h.o, c: h.c });
  }
  return groups.map(g => {
    const d = g.days.length > 1 ? `${DAYS_RU[g.days[0]]}–${DAYS_RU[g.days[g.days.length - 1]]}` : DAYS_RU[g.days[0]];
    return `${d} ${g.o}–${g.c}`;
  }).join(", ");
}
const fmtRate = v => (Math.round(v * 100) / 100).toLocaleString("ru-RU");

/** Источники дают время по-разному: ISO у banki.ru и «21.08.2026 11:00» у mainfin. */
function parseAt(s) {
  if (!s) return null;
  const m = String(s).match(/^(\d{2})\.(\d{2})\.(\d{4})[ T](\d{2}):(\d{2})/);
  const d = m ? new Date(`${m[3]}-${m[2]}-${m[1]}T${m[4]}:${m[5]}:00+03:00`) : new Date(s);
  return isNaN(d) ? null : d;
}

/** Насколько свежий курс: подпись + признак «пора не доверять». */
function freshness(at) {
  const d = parseAt(at);
  if (!d) return { text: "время обновления неизвестно", stale: true };
  const hours = (Date.now() - d) / 3600e3;
  const time = d.toLocaleTimeString("ru-RU", { timeZone: "Europe/Moscow", hour: "2-digit", minute: "2-digit" });
  const today = new Date().toLocaleDateString("ru-RU", { timeZone: "Europe/Moscow" })
    === d.toLocaleDateString("ru-RU", { timeZone: "Europe/Moscow" });
  const day = d.toLocaleDateString("ru-RU", { timeZone: "Europe/Moscow", day: "2-digit", month: "2-digit" });
  return { text: today ? `курс от ${time}` : `курс от ${day} ${time}`, stale: hours > 3 };
}

/* ---------- отделения: постоянные и дежурные ----------
   Дежурные добавляют на неделю дежурства — держим их отдельным слоем,
   чтобы в обычные дни они не мешали. Выбор запоминается между заходами. */
// Слой отделений УРКО временно скрыт с сайта. Данные, сборщики и таймеры на месте —
// чтобы вернуть, поставить true здесь и в table.html.
const SHOW_DUTY = true;
const DUTY = SHOW_DUTY && typeof BRANCHES_DUTY !== "undefined" ? BRANCHES_DUTY : [];
DUTY.forEach(b => b.duty = true);
let dutyOn = SHOW_DUTY && localStorage.getItem("dutyOn") === "1";
const activeBranches = () => dutyOn ? BRANCHES.concat(DUTY) : BRANCHES;

/* ---------- состояние ---------- */
let station = null;        // выбранная станция {n, lat, lng, l}
let selectedBranch = null; // подсвеченный офис
let ratesFetchedAt = null;

/* ---------- карта ---------- */
const map = L.map("map", { zoomControl: true });
map.attributionControl.setPrefix("");
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19, attribution: "© OpenStreetMap"
}).addTo(map);

/* слой метро: линии в фирменных цветах + станции-кружки */
const metroLayer = L.layerGroup();
for (const line of METRO_LINES) {
  const pts = line.s.map(s => [s.lat, s.lng]);
  if (line.ring && pts.length > 2) pts.push(pts[0]);
  L.polyline(pts, { color: line.c, weight: 3, opacity: .8, interactive: false })
    .addTo(metroLayer);
}
for (const line of METRO_LINES) {
  for (const s of line.s) {
    L.circleMarker([s.lat, s.lng], {
      radius: 4, color: line.c, weight: 2, fillColor: "#fff", fillOpacity: 1
    }).bindTooltip(`${s.n} · ${line.n}`, { direction: "top", offset: [0, -6] })
      .on("click", () => {
        let best = null, bd = Infinity;
        for (const m of METRO) {
          const d = distM(s.lat, s.lng, m.lat, m.lng);
          if (norm(m.n).includes(norm(s.n)) && d < bd) { best = m; bd = d; }
        }
        pickStation(best || { n: s.n, lat: s.lat, lng: s.lng, l: [{ n: line.n, c: line.c }] });
      })
      .addTo(metroLayer);
  }
}
metroLayer.addTo(map);

/* слой конкурентов с курсами: красные — те, кто нас обыгрывает у ближайшего отделения */
const compLayer = L.layerGroup();
/** Пересобирается после подгрузки живых курсов: красный = обыгрывает наше ближайшее отделение. */
function renderCompMarkers() {
  compLayer.clearLayers();
  const points = [];
  for (const c of (typeof COMPETITORS !== "undefined" ? COMPETITORS : [])) {
    points.push({ bank: c.bank, addr: c.address || c.name, lat: c.lat, lon: c.lon,
                  rates: c.rates, near: c.near[0], precision: "office", at: c.at });
  }
  for (const o of [...(typeof OFFICES_MF !== "undefined" ? OFFICES_MF : []),
                   ...(typeof COMPETITORS_OBLAST !== "undefined" ? COMPETITORS_OBLAST : [])]) {
    points.push({ bank: o.bank, addr: o.address, lat: o.lat, lon: o.lon,
                  rates: o.rates, near: o.near[0], precision: "office", at: o.at });
  }
  for (const p of (typeof POI !== "undefined" ? POI : [])) {
    const r = poiRates(p);
    if (r) points.push({ bank: r.name, addr: p.addr, lat: p.lat, lon: p.lon,
                         rates: r.rates, near: p.near[0], at: r.at,
                         precision: r.same ? "uniform" : "city" });
  }
  for (const pt of points) {
    const nearest = BRANCHES.concat(DUTY).find(b => b.num === pt.near.num);
    const beats = nearest && beatsAnything(nearest, pt);
    const size = pt.precision === "city" ? 11 : 14;  // курс по городу — точка помельче
    const icon = L.divIcon({
      className: "", iconSize: [size, size], iconAnchor: [size / 2, size / 2],
      html: `<div class="compmarker${beats ? " beats" : ""}${pt.precision === "city" ? " city" : ""}"
              style="width:${size}px;height:${size}px"></div>`
    });
    const curs = Object.keys(pt.rates).sort()
      .map(k => `${k} ${fmtRate(pt.rates[k].buy)} / ${fmtRate(pt.rates[k].sell)}`).join("<br>");
    L.marker([pt.lat, pt.lon], { icon })
      .bindPopup(`<b>${pt.bank}</b>${pt.addr ? "<br>" + pt.addr : ""}<br>
        <span style="color:#67707f">${pt.near.d} м до нашего №${pt.near.num}${beats ? " · курс лучше нашего" : ""}</span><br>
        <div style="margin-top:4px">${curs}</div>
        <div style="margin-top:3px" class="${freshness(pt.at).stale ? "stale" : ""}"
             ${freshness(pt.at).stale ? "" : 'style="color:#67707f;margin-top:3px"'}>${freshness(pt.at).text}</div>
        ${pt.precision === "city" ? `<div style="color:#67707f">курс банка по Москве</div>` : ""}`)
      .addTo(compLayer);
  }
}
renderCompMarkers();
compLayer.addTo(map);

/* остальные банки и обменники рядом — без публикуемых курсов */
const poiLayer = L.layerGroup();
for (const p of (typeof POI !== "undefined" ? POI : [])) {
  if (poiRates(p)) continue;  // уже показан в слое конкурентов с курсом
  L.circleMarker([p.lat, p.lon], {
    radius: 3.5, color: "#8a93a3", weight: 1, fillColor: "#b6bdc9", fillOpacity: .9
  }).bindPopup(`<b>${p.n}</b><br>${p.kind === "exchange" ? "обменный пункт" : "банк"}${p.addr ? "<br>" + p.addr : ""}
    <br><span style="color:#67707f">${p.near[0].d} м до нашего №${p.near[0].num} · курс не публикуется</span>`)
    .addTo(poiLayer);
}

// объявляем заранее: слой наполняется ниже, а контрол нужен здесь
const dutyLayerRef = { layer: null };

const brMarkers = {};
function addBranchMarker(b, layer) {
  const icon = L.divIcon({
    className: "",
    html: `<div class="brmarker${b.duty ? " duty" : ""}" id="mk${b.num}">${b.num}</div>`,
    iconSize: [44, 26], iconAnchor: [22, 13]
  });
  const mk = L.marker([b.lat, b.lon], { icon });
  mk.on("click", () => selectBranch(b.num, true));
  mk.addTo(layer);
  brMarkers[b.num] = mk;
}
for (const b of BRANCHES) addBranchMarker(b, map);

const dutyLayer = L.layerGroup();
for (const b of DUTY) addBranchMarker(b, dutyLayer);
if (dutyOn) dutyLayer.addTo(map);

L.control.layers(null, {
  ...(SHOW_DUTY ? { [`Отделения УРКО (${DUTY.length})`]: dutyLayer } : {}),
  "Линии и станции метро": metroLayer,
  "Конкуренты с курсами": compLayer,
  "Другие банки рядом": poiLayer,
}, { collapsed: false, position: "topright" }).addTo(map);

map.on("overlayadd overlayremove", e => {
  if (e.layer !== dutyLayer) return;
  dutyOn = e.type === "overlayadd";
  localStorage.setItem("dutyOn", dutyOn ? "1" : "0");
  if (dutyOn) refreshRates(DUTY);   // курсы дежурных тянем только когда они нужны
  render();
});

let stMarker = null, linkLines = [];
fitAll();
function fitAll() {
  map.fitBounds(L.latLngBounds(activeBranches().map(b => [b.lat, b.lon])).pad(0.08));
}

/* ---------- поиск станции ---------- */
const q = document.getElementById("q"), sug = document.getElementById("suggest"), clearBtn = document.getElementById("clearq");
let sugItems = [], sugIdx = -1;

q.addEventListener("input", () => {
  clearBtn.style.display = q.value ? "block" : "none";
  const v = norm(q.value);
  if (v.length < 1) { hideSug(); return; }
  const starts = [], contains = [];
  for (const s of METRO) {
    const n = norm(s.n);
    if (n.startsWith(v)) starts.push(s);
    else if (n.includes(v)) contains.push(s);
  }
  sugItems = starts.concat(contains).slice(0, 9);
  sugIdx = -1;
  if (!sugItems.length) { hideSug(); return; }
  sug.innerHTML = sugItems.map((s, i) =>
    `<div data-i="${i}">${s.l.map(l => `<span class="dot" style="background:${l.c}" title="${l.n}"></span>`).join("")}<span>${s.n}</span></div>`
  ).join("");
  sug.style.display = "block";
  [...sug.children].forEach(el => el.addEventListener("mousedown", e => { e.preventDefault(); pickStation(sugItems[+el.dataset.i]); }));
});
q.addEventListener("keydown", e => {
  if (sug.style.display !== "block") return;
  if (e.key === "ArrowDown") { sugIdx = Math.min(sugIdx + 1, sugItems.length - 1); markSug(); e.preventDefault(); }
  else if (e.key === "ArrowUp") { sugIdx = Math.max(sugIdx - 1, 0); markSug(); e.preventDefault(); }
  else if (e.key === "Enter") { pickStation(sugItems[Math.max(sugIdx, 0)]); e.preventDefault(); }
  else if (e.key === "Escape") hideSug();
});
q.addEventListener("blur", () => setTimeout(hideSug, 150));
clearBtn.addEventListener("click", resetStation);
function markSug() { [...sug.children].forEach((el, i) => el.classList.toggle("active", i === sugIdx)); }
function hideSug() { sug.style.display = "none"; }

function pickStation(s) {
  station = s; selectedBranch = null;
  q.value = s.n; hideSug(); q.blur();
  clearBtn.style.display = "block";
  render();
}
function resetStation() {
  station = null; selectedBranch = null; q.value = "";
  clearBtn.style.display = "none";
  render(); fitAll();
}

/* ---------- выбор офиса ---------- */
function selectBranch(num, scroll) {
  selectedBranch = num;
  renderPanel();
  document.querySelectorAll(".brmarker").forEach(el => el.style.outline = "");
  const el = document.getElementById("mk" + num);
  if (el) el.style.outline = "3px solid #d21f26";
  if (scroll) {
    const card = document.getElementById("card" + num);
    if (card) card.scrollIntoView({ behavior: "smooth", block: "start" });
  }
}

/* ---------- отрисовка ---------- */
function branchesSorted() {
  if (!station) return [...activeBranches()].sort((a, b) => a.num.localeCompare(b.num));
  return [...activeBranches()]
    .map(b => ({ ...b, d: distM(station.lat, station.lng, b.lat, b.lon) }))
    .sort((a, b) => a.d - b.d);
}

function render() {
  renderPanel();
  renderMapExtras();
}

function renderMapExtras() {
  linkLines.forEach(l => map.removeLayer(l)); linkLines = [];
  if (stMarker) { map.removeLayer(stMarker); stMarker = null; }
  if (!station) return;
  const icon = L.divIcon({ className: "", html: `<div class="stmarker" style="width:30px;height:30px">М</div>`, iconSize: [30, 30], iconAnchor: [15, 15] });
  stMarker = L.marker([station.lat, station.lng], { icon, zIndexOffset: 1000 }).addTo(map)
    .bindPopup(`<b>${station.n}</b>`);
  const top = branchesSorted().slice(0, 3);
  for (const b of top) {
    linkLines.push(L.polyline([[station.lat, station.lng], [b.lat, b.lon]],
      { color: "#1a3e8c", weight: 2.5, dashArray: "6 7", opacity: .75 }).addTo(map));
  }
  const bounds = L.latLngBounds([[station.lat, station.lng], ...top.map(b => [b.lat, b.lon])]);
  map.fitBounds(bounds.pad(0.25));
  document.querySelectorAll(".brmarker").forEach(el => el.classList.remove("near"));
  top.forEach(b => { const el = document.getElementById("mk" + b.num); if (el) el.classList.add("near"); });
}

function ratesTable(b) {
  if (!b.rates || !b.rates.length) {
    return `<div class="rates-note">Курсы не опубликованы — уточнить по телефону</div>`;
  }
  const at = b.rates[0].at ? new Date(b.rates[0].at) : null;
  const now = new Date();
  const stale = at && (now - at) > 26 * 3600e3;
  const atTxt = at ? at.toLocaleString("ru-RU", { timeZone: "Europe/Moscow", day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }) : "";
  const rows = b.rates.map(r =>
    `<tr><td>${r.cur}${CUR_SIGN[r.cur] && CUR_SIGN[r.cur] !== r.cur ? " " + CUR_SIGN[r.cur] : ""}</td><td>${fmtRate(r.buy)}</td><td>${fmtRate(r.sell)}</td></tr>`).join("");
  const extra = b.currencies.filter(c => c !== "RUB" && !b.rates.some(r => r.cur === c));
  return `<table class="rates">
    <tr><th>Валюта</th><th>Покупка</th><th>Продажа</th></tr>${rows}</table>
    <div class="rates-note ${stale ? "stale" : ""}">Курс от ${atTxt}${stale ? " ⚠ возможно устарел" : ""}</div>
    ${extra.length ? `<div class="cur-chips">Также обмен: ${extra.join(", ")} — курс по телефону</div>` : ""}`;
}

/* ---------- конкуренты ----------
   Два источника: banki.ru — курс конкретного офиса; mainfin.ru — курс банка по городу
   (для банков вроде ВТБ и Газпромбанка, которые в banki.ru не публикуются).
   Городские курсы помечаем звёздочкой — в конкретном офисе может отличаться. */
/** Курс банка по городу для точки из OSM, если источник его знает.
    Без внешних const: функция вызывается выше по файлу, при построении слоёв карты. */
function poiRates(p) {
  const rates = typeof BANK_RATES !== "undefined" ? BANK_RATES : {};
  const map = typeof POI_BANK !== "undefined" ? POI_BANK : {};
  const alias = map[p.n];
  return alias && rates[alias] ? rates[alias] : null;
}

const COMP_BY_BRANCH = {};   // всё, с чем можно сравниться: офисные + городские курсы
const NORATE_BY_BRANCH = {}; // точки рядом, по которым курса нет вообще

for (const c of (typeof COMPETITORS !== "undefined" ? COMPETITORS : [])) {
  for (const n of c.near) (COMP_BY_BRANCH[n.num] ||= []).push({
    c: { bank: c.bank, address: c.address || c.name, rates: c.rates, precision: "office",
         lat: c.lat, lon: c.lon, at: c.at },
    d: n.d,
  });
}
// отделения из mainfin по Москве и по городам области: курс по конкретному офису
for (const o of [...(typeof OFFICES_MF !== "undefined" ? OFFICES_MF : []),
                 ...(typeof COMPETITORS_OBLAST !== "undefined" ? COMPETITORS_OBLAST : [])]) {
  for (const n of o.near) (COMP_BY_BRANCH[n.num] ||= []).push({
    c: { bank: o.bank, address: o.address, rates: o.rates, precision: "office",
         lat: o.lat, lon: o.lon, at: o.at },
    d: n.d,
  });
}
for (const p of (typeof POI !== "undefined" ? POI : [])) {
  const r = poiRates(p);
  for (const n of p.near) {
    if (r) {
      // same = во всех отделениях банка курс совпадает (проверено по офисным данным banki.ru)
      (COMP_BY_BRANCH[n.num] ||= []).push({
        c: { bank: r.name, address: p.addr || "", rates: r.rates, at: r.at,
             lat: p.lat, lon: p.lon, precision: r.same ? "uniform" : "city" },
        d: n.d,
      });
    } else {
      (NORATE_BY_BRANCH[n.num] ||= []).push({ p, d: n.d });
    }
  }
}
/** «Сбербанк» и «СберБанк», «ПСБ» и «Банк ПСБ» — один и тот же банк в разных источниках. */
const normBank = s => (s || "").toLowerCase().replace(/ё/g, "е")
  .replace(/банк|bank/g, "").replace(/[^a-zа-я0-9]/g, "");

for (const k in COMP_BY_BRANCH) {
  COMP_BY_BRANCH[k].sort((a, b) => a.d - b.d);
  const офисные = new Set(COMP_BY_BRANCH[k].filter(x => x.c.precision === "office")
    .map(x => normBank(x.c.bank)));
  const seen = new Set();
  COMP_BY_BRANCH[k] = COMP_BY_BRANCH[k].filter(({ c }) => {
    if (c.precision === "office") return true;
    const key = normBank(c.bank);
    // у банка уже есть курс конкретного офиса рядом — городская строка не нужна
    if (офисные.has(key) || seen.has(key)) return false;
    seen.add(key);
    return true;
  });
}
for (const k in NORATE_BY_BRANCH) NORATE_BY_BRANCH[k].sort((a, b) => a.d - b.d);

// объявлена через function, а не const: слой конкурентов на карте строится выше по файлу
function ourRate(b, cur) { return b.rates.find(r => r.cur === cur); }

/** Где конкурент выгоднее нас: покупает дороже (клиент сдаёт) или продаёт дешевле (клиент берёт). */
function compare(b, c) {
  const better = [];
  for (const cur of Object.keys(c.rates)) {
    const our = ourRate(b, cur), their = c.rates[cur];
    if (!our) continue;
    if (their.buy && our.buy && their.buy > our.buy)
      better.push({ cur, kind: "buy", their: their.buy, our: our.buy });
    if (their.sell && our.sell && their.sell < our.sell)
      better.push({ cur, kind: "sell", their: their.sell, our: our.sell });
  }
  return better;
}

function beatsAnything(b, c) { return compare(b, c).length > 0; }

function compRatesTable(b, c) {
  const curs = Object.keys(c.rates).sort();
  const rows = curs.map(cur => {
    const our = ourRate(b, cur), t = c.rates[cur];
    const buyWorse = our && t.buy && t.buy > our.buy;
    const sellWorse = our && t.sell && t.sell < our.sell;
    return `<tr><td>${cur}</td>
      <td class="${buyWorse ? "worse" : ""}">${t.buy ? fmtRate(t.buy) : "—"}</td>
      <td class="${sellWorse ? "worse" : ""}">${t.sell ? fmtRate(t.sell) : "—"}</td>
      <td>${our ? fmtRate(our.buy) + " / " + fmtRate(our.sell) : "нет"}</td></tr>`;
  }).join("");
  return `<table class="comp-tbl">
    <tr><th>Валюта</th><th>Покупка</th><th>Продажа</th><th>у нас</th></tr>${rows}</table>`;
}

/** Клик по конкуренту в списке — показать его точку на карте и открыть подпись. */
function showCompetitor(lat, lon) {
  if (!map.hasLayer(compLayer)) map.addLayer(compLayer);
  map.setView([lat, lon], 17);
  let best = null, bd = Infinity;
  compLayer.eachLayer(m => {
    const p = m.getLatLng();
    const d = Math.abs(p.lat - lat) + Math.abs(p.lng - lon);
    if (d < bd) { bd = d; best = m; }
  });
  if (best && bd < 0.0005) best.openPopup();
  if (window.innerWidth <= 800) document.getElementById("map").scrollIntoView({ behavior: "smooth" });
}

/** Сосед продаёт валюту дешевле, чем мы её покупаем: у нас можно перепродать с прибылью.
    Для отделения это потеря маржи, поэтому выносим отдельной строкой наверх. */
function arbitrageWarnings(b) {
  const list = COMP_BY_BRANCH[b.num] || [];
  const out = [];
  for (const our of b.rates) {
    let best = null;
    for (const { c, d } of list) {
      const t = c.rates[our.cur];
      if (t && t.sell && t.sell < our.buy && (!best || t.sell < best.sell))
        best = { sell: t.sell, bank: c.bank, d, city: c.precision === "city" };
    }
    if (best) out.push({ cur: our.cur, our: our.buy, ...best, diff: our.buy - best.sell });
  }
  return out.sort((x, y) => y.diff - x.diff);
}

/** Как часто банк переставляет курс — по нашим замерам раз в 2 часа. */
function volatilityNote(bank) {
  const v = typeof VOLATILITY !== "undefined" ? VOLATILITY : {};
  const days = typeof VOLATILITY_DAYS !== "undefined" ? VOLATILITY_DAYS : 0;
  const key = Object.keys(v).find(k => normBank(k) === normBank(bank));
  if (!key || days < 1 || v[key].samples < 8) return "";   // мало данных — молчим
  const s = v[key].share;
  const txt = s >= 0.6 ? "курс меняет постоянно"
    : s >= 0.25 ? "курс меняет несколько раз в день"
    : s > 0 ? "курс меняет редко" : "курс почти не меняет";
  return ` <span class="comp-addr">· ${txt}</span>`;
}

function competitorsBlock(b) {
  const list = COMP_BY_BRANCH[b.num] || [];
  const pois = NORATE_BY_BRANCH[b.num] || [];
  if (!list.length && !pois.length) return "";
  const beating = list.filter(x => beatsAnything(b, x.c));
  const arb = arbitrageWarnings(b);

  // сводка для разговора: по каждой нашей валюте — лучшее предложение рядом
  const ORDER = ["USD", "EUR", "CNY", "AED", "GBP", "CHF", "TRY", "KZT", "AMD", "ILS"];
  const summary = b.rates.map(our => {
    let bb = null, bs = null;
    for (const { c, d } of list) {
      const t = c.rates[our.cur];
      if (!t) continue;
      if (t.buy && (!bb || t.buy > bb.v)) bb = { v: t.buy, bank: c.bank, d, city: c.precision === "city" };
      if (t.sell && (!bs || t.sell < bs.v)) bs = { v: t.sell, bank: c.bank, d, city: c.precision === "city" };
    }
    if (!bb && !bs) return "";
    const buyWorse = bb && bb.v > our.buy, sellWorse = bs && bs.v < our.sell;
    const cell = (x, worse) => x
      ? `<span class="${worse ? "comp-warn" : ""}">${fmtRate(x.v)}</span><span class="comp-addr"> ${x.bank}${x.city ? "*" : ""}, ${x.d} м</span>`
      : "—";
    return `<tr><td>${our.cur}</td><td>${fmtRate(our.buy)} / ${fmtRate(our.sell)}</td>
      <td>${cell(bb, buyWorse)}</td><td>${cell(bs, sellWorse)}</td></tr>`;
  }).join("");
  const bestLines = summary
    ? `<table class="comp-tbl"><tr><th>Валюта</th><th>У нас пок/прод</th>
         <th>Лучше всех покупают</th><th>Дешевле всех продают</th></tr>${summary}</table>`
    : "";

  const items = list.map(({ c, d }) => `<div class="comp-item" onclick="showCompetitor(${c.lat}, ${c.lon}); event.stopPropagation()" title="Показать на карте">
      <div class="comp-name">${c.bank} <span class="kv">· ${d} м</span>
        <span class="${freshness(c.at).stale ? "stale" : "comp-addr"}">· ${freshness(c.at).text}</span>${volatilityNote(c.bank)}${c.precision === "city"
        ? ` <span class="comp-addr">курс по городу*</span>`
        : c.precision === "uniform"
          ? ` <span class="comp-addr">курс одинаковый во всех отделениях</span>` : ""}</div>
      <div class="comp-addr">${c.address || "адрес уточняется"} <span class="comp-show">показать на карте</span></div>
      ${compRatesTable(b, c)}</div>`).join("");
  const hasCity = list.some(x => x.c.precision === "city");

  return `<div class="comp-block">
    ${arb.length ? `<div class="arb">
      <b>Мы покупаем дороже, чем сосед продаёт</b>
      ${arb.map(a => `<div>${a.cur}: у нас покупка <b>${fmtRate(a.our)}</b> — ${a.bank}${a.city ? "*" : ""}
        продаёт по <b>${fmtRate(a.sell)}</b> (${a.d} м). Разница ${fmtRate(a.diff)} ₽ на единицу.</div>`).join("")}
      <div class="arb-note">Валюту могут купить у соседа и сдать нам — на этом теряем мы. Стоит проверить наш курс.</div>
    </div>` : ""}
    <div class="comp-head">Конкуренты в 1 км: ${list.length} с курсами${pois.length ? ` · ещё ${pois.length} точек без публикуемых курсов` : ""}
      ${beating.length ? `<span class="comp-warn">· выгоднее нас: ${beating.length}</span>` : `<span class="comp-ok">· наш курс не хуже</span>`}</div>
    <div class="comp-lines">${bestLines}</div>
    ${hasCity ? `<div class="rates-note">* курс банка по Москве — в конкретном офисе может отличаться</div>` : ""}
    ${list.length ? `<details class="comp" onclick="event.stopPropagation()"><summary>Курсы конкурентов рядом (${list.length})</summary>${items}
      <div class="rates-note">Источники: banki.ru (курс офиса) и mainfin.ru (курс банка по городу), обновляются автоматически${typeof COMPETITORS_AT !== "undefined" ? ` · ${new Date(COMPETITORS_AT).toLocaleString("ru-RU", { timeZone: "Europe/Moscow", day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" })}` : ""}</div>
      </details>` : ""}
  </div>`;
}

function card(b) {
  const w = station ? walkInfo(b.d) : null;
  const route = station
    ? `https://yandex.ru/maps/?rtext=${station.lat},${station.lng}~${b.lat},${b.lon}&rtt=pd`
    : `https://yandex.ru/maps/?pt=${b.lon},${b.lat}&z=17`;
  return `<div class="card ${selectedBranch === b.num ? "selected" : ""}" id="card${b.num}" onclick="selectBranch('${b.num}', false); map.setView([${b.lat}, ${b.lon}], 15);">
    <div class="toprow">
      <span class="num${b.duty ? " duty" : ""}">№ ${b.num}</span>
      ${b.duty ? `<span class="duty-tag">УРКО${b.city && b.city !== "Москва" ? " · " + b.city : ""}</span>` : ""}
      ${w ? `<span class="walk">${w.txt}</span>` : ""}
    </div>
    <div class="addr">${b.address}</div>
    ${b.metro.length ? `<div class="metro-tags">${b.metro.map(m => `<span class="mtag">${m}</span>`).join("")}</div>` : ""}
    <div class="kv">График: <b>${hoursText(b)}</b>${b.hoursNotes ? ` · перерыв: ${b.hoursNotes.replace(/^перерыв[а-яё]*\s*:?\s*/i, "").replace(/\n/g, ", ")}` : ""}</div>
    ${b.notes ? `<details class="howto" onclick="event.stopPropagation()"><summary>Как найти</summary><p>${b.notes}</p></details>` : ""}
    ${ratesTable(b)}
    ${competitorsBlock(b)}
    <div class="actions">
      <a href="${route}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${station ? "Маршрут от метро в Яндекс Картах" : "Открыть в Яндекс Картах"}</a>
      <a href="https://unistream.ru/exchange?branch=${b.id}" target="_blank" rel="noopener" onclick="event.stopPropagation()">Курсы на unistream.ru</a>
    </div>
  </div>`;
}

function renderPanel() {
  const p = document.getElementById("panel");
  const list = branchesSorted();
  if (!station) {
    p.innerHTML = `<div class="hint">Введите станцию метро, которую назвал клиент, — покажу ближайшие отделения, время пешком и курсы. Или нажмите на отделение на карте.</div>`
      + list.map(card).join("");
    return;
  }
  const lines = station.l.map(l => `<span class="dot" style="background:${l.c}" title="${l.n}"></span>`).join("");
  const top = list.slice(0, 3), rest = list.slice(3);
  p.innerHTML = `<div class="station-head"><span class="stmarker" style="display:inline-block;width:26px;height:26px;flex:0 0 26px">М</span><b>${station.n}</b><span class="lines">${lines}</span></div>`
    + `<div class="hint">Ближайшие отделения:</div>` + top.map(card).join("")
    + `<details style="margin-top:6px"><summary style="cursor:pointer;color:var(--blue);font-weight:600">Остальные отделения (${rest.length})</summary>${rest.map(card).join("")}</details>`;
}

/* ---------- живые курсы ---------- */
async function refreshRates(only) {
  const targets = only || activeBranches();
  document.getElementById("ratesStamp").textContent = "Курсы: обновляю…";
  // по 8 запросов за раз: дежурных 81, разом браузер их не тянет
  const queue = [...targets];
  let ok = 0;
  async function worker() {
    while (queue.length) {
      const b = queue.shift();
      try {
        const r = await fetch(`https://unistream.ru/api/poses/exchange/${b.id}`, { headers: { "Accept-Language": "ru" } });
        if (!r.ok) throw new Error(r.status);
        const d = await r.json();
        b.rates = (d.exchangeRates || []).map(x => ({ cur: x.currency, buy: x.buyRate, sell: x.sellRate, at: x.lastUpdated }));
        b.currencies = d.currencies || b.currencies;
        ok++;
      } catch (e) { /* отделение оставим на сохранённых курсах */ }
    }
  }
  await Promise.all(Array.from({ length: 8 }, worker));
  const total = targets.length;
  const t = new Date().toLocaleTimeString("ru-RU", { timeZone: "Europe/Moscow", hour: "2-digit", minute: "2-digit" });
  ratesFetchedAt = t;
  document.getElementById("ratesStamp").textContent = ok
    ? `Курсы обновлены в ${t}${ok < total ? ` (${ok}/${total})` : ""}`
    : `Live-курсы недоступны — показаны сохранённые от ${new Date(DATA_BUILT_AT).toLocaleDateString("ru-RU")}`;
  renderCompMarkers();
  renderPanel();
}
document.getElementById("refreshBtn").addEventListener("click", refreshRates);
setInterval(refreshRates, 10 * 60 * 1000);

render();
refreshRates();
</script>
</body>
</html>
